name: PlatformIO CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native tests, coverage and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and gcovr
        run: python -m pip install platformio gcovr

      - name: Compile and run native tests
        id: tests
        run: pio test -e native -v

      - name: Generate coverage report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: python scripts/coverage-report.py

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 1

      - name: Run static analysis
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: >
          pio check -e native
          --src-filters="-<*>"
          --src-filters="+<lib/AlarmCore/>"
          --src-filters="+<sim/>"
          --src-filters="+<test/>"
          --fail-on-defect=low
          --fail-on-defect=medium
          --fail-on-defect=high  

  sim:
    name: Simulator build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Compile simulator
        run: pio run -e sim

  board:
    name: ESP32-S3 build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Cache ESP32 dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.platformio/.cache
            .pio/libdeps/esp32s3
          key: ${{ runner.os }}-${{ runner.arch }}-pio-esp32s3-v1-${{ hashFiles('platformio.ini') }}

      - name: Compile firmware
        run: pio run -e esp32s3